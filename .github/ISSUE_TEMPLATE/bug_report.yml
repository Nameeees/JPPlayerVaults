name: Bug report
description: Something does not work as documented
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the versions and the log — without them the issue
        usually cannot be reproduced.
  - type: input
    id: server
    attributes:
      label: Server software and version
      description: For example "Paper 1.21.11 build 132" or "Spigot 1.8.8".
      placeholder: Paper 1.21.11 build 132
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: JPPlayerVaults version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "21"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /pv 1
        2. Put an item in the vault
        3. ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: config.yml
      description: Paste your plugins/JPPlayerVaults/config.yml.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console log
      description: The lines around the error, or a link to a paste site.
      render: text
    validations:
      required: true
